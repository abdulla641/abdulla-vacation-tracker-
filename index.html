<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kerala Vacation Tracker 2026</title><link rel="stylesheet" href="style.css?v=1"></head><body><div class="app"><header><h1>🌴 Kerala Vacation 2026</h1><p>17 September → 20 October 2026</p><p id="tripDay"></p></header><main><section id="home" class="tab active"><div class="dashboard"><div class="box">💰 Available<h2 id="moneyAvailable">₹0</h2></div><div class="box">💸 Spent<h2 id="totalSpent">₹0</h2></div><div class="box">💳 Remaining<h2 id="remainingMoney">₹0</h2></div><div class="box">📜 Transactions<h2 id="transactionCount">0</h2></div></div></section><section id="add" class="tab"><div class="card"><h2>Add Money</h2><input id="moneyAmount" type="number" placeholder="Amount ₹"><input id="moneyNote" placeholder="Note"><button onclick="addMoney()">Add Money</button></div><div class="card"><h2>Add Expense</h2><input id="amount" type="number" placeholder="Amount ₹"><input id="note" placeholder="Description"><button onclick="addExpense()">Add Expense</button></div></section><section id="historyTab" class="tab"><div class="card"><h2>📜 History</h2><div id="history"></div></div></section><section id="reports" class="tab"><div class="card"><h2>📊 Reports</h2></div></section><section id="settings" class="tab"><div class="card"><h2>⚙️ Settings</h2><button onclick="exportData()">Backup</button></div></section></main><nav class="bottom-nav"><button onclick="showTab('home')">🏠<br>Home</button><button onclick="showTab('add')">➕<br>Add</button><button onclick="showTab('historyTab')">📜<br>History</button><button onclick="showTab('reports')">📊<br>Reports</button><button onclick="showTab('settings')">⚙️<br>Settings</button></nav></div><script>function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}</script><script src="app.js?v=1"></script></body></html>
